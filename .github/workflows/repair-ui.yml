name: repair-ui-72299

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download and verify original r241 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download base-r241-api102 --repo "$GITHUB_REPOSITORY" --pattern tmoe-installed.apk
          echo '6e3225cc3382b20bfacca58ff0f2795de771e7a2dcb1be93b1c34a7e5842a35b  tmoe-installed.apk' | sha256sum -c -
          curl --fail --location --retry 3 --output apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          echo 'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  apktool.jar' | sha256sum -c -

      - name: Decode, apply audited patch, rebuild
        run: |
          java -Xmx1536m -jar apktool.jar d -f -r -o decoded tmoe-installed.apk
          python3 repair/patch_ui_smali.py decoded --audit patch-audit.json
          java -Xmx1536m -jar apktool.jar b decoded -o TMoe-ui-72299-unsigned.apk
          python3 - <<'PY'
          import zipfile,hashlib,zlib,struct
          with zipfile.ZipFile('TMoe-ui-72299-unsigned.apk') as z:
              for n in z.namelist():
                  if not n.endswith('.dex'): continue
                  b=z.read(n)
                  assert b[12:32] == hashlib.sha1(b[32:]).digest(), n+' SHA1'
                  assert struct.unpack_from('<I',b,8)[0] == zlib.adler32(b[12:]), n+' Adler32'
          PY

      - name: Install fixed Android signing tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Sign using repository's persistent keystore
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          SIGN_KEYSTORE_PASSWORD: ${{ secrets.SIGN_KEYSTORE_PASSWORD }}
          SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
          SIGN_KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SIGN_KEYSTORE_BASE64 SIGN_KEYSTORE_PASSWORD SIGN_KEY_ALIAS SIGN_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name. Configure a persistent repository signing key; this workflow does not generate throwaway keys."
              exit 1
            fi
          done
          trap 'rm -f signing.keystore' EXIT
          printf '%s' "$SIGN_KEYSTORE_BASE64" | base64 --decode > signing.keystore
          chmod 600 signing.keystore
          zipalign -f -p 4 TMoe-ui-72299-unsigned.apk TMoe-ui-72299-aligned.apk
          apksigner sign --ks signing.keystore --ks-key-alias "$SIGN_KEY_ALIAS" --ks-pass env:SIGN_KEYSTORE_PASSWORD --key-pass env:SIGN_KEY_PASSWORD --out TMoe-r241-api102-ui-72299-signed.apk TMoe-ui-72299-aligned.apk
          apksigner verify --verbose --print-certs TMoe-r241-api102-ui-72299-signed.apk > signature-report.txt
          cat signature-report.txt
          zipalign -c -p 4 TMoe-r241-api102-ui-72299-signed.apk
          sha256sum TMoe-r241-api102-ui-72299-signed.apk > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: TMoe-ui-72299-${{ github.run_number }}
          path: |
            TMoe-r241-api102-ui-72299-signed.apk
            SHA256SUMS.txt
            signature-report.txt
            patch-audit.json
          if-no-files-found: error

      - name: Publish candidate release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ui-72299-${GITHUB_RUN_NUMBER}" TMoe-r241-api102-ui-72299-signed.apk SHA256SUMS.txt signature-report.txt patch-audit.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'TMoe Telegram 13.1.0 settings UI candidate' --notes 'Static contract: t91.b0 / t91.f0 + Components.f71. Adds audited 72299 Fragment mappings. Built and signature-verified; on-device UI acceptance is still required.'
